# .github/workflows/generate.yml
name: Generate RSS Feeds

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 9 * * *'  # 毎日 18:00 JST (09:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('flake.nix', 'flake.lock', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json') }}
          restore-prefixes-first-match: nix-
          gc-max-store-size-linux: 4G

      - name: Build devShell dependencies
        run: nix build .#devShells.x86_64-linux.default.inputDerivation --no-link

      - name: Generate feeds
        run: nix develop -c xvfb-run ruby bin/generate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # deploy-pages は run 内に同名 artifact が複数あると失敗する。
      # run を再実行すると前の試行の artifact が残るので、試行ごとに名前を変える。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: 'output'

      # upload 直後は artifact が一覧に出ず、deploy-pages が失敗することがある
      # (actions/deploy-pages#451)。deploy-pages には一覧を介さずに artifact を
      # 指定する入力が無いので、失敗したら間を置いて再試行する。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
