name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ci-nix-${{ hashFiles('flake.nix', 'flake.lock', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json') }}
          restore-prefixes-first-match: ci-nix-
          gc-max-store-size-linux: 4G

      - name: Build locked runtime dependencies
        run: nix build .#devShells.x86_64-linux.default.inputDerivation --no-link

      - name: Run specs
        run: nix develop -c bundle exec rspec
